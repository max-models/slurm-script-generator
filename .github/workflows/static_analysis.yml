name: Static analysis

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Download and run cloc
        run: |
          curl -s https://raw.githubusercontent.com/AlDanial/cloc/master/cloc > cloc
          chmod +x cloc
          ./cloc --version
          ./cloc $(git ls-files)

      - name: Linting with ruff (including import sorting)
        run: |
          pip install ruff
          ruff check .

      - name: Code formatting with ruff
        run: ruff format --check .

      - name: Check statement order
        run: |
          pip install ssort
          ssort --check --diff .
