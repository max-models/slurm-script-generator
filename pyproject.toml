[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools", "wheel" ]

[project]
name = "slurm-script-generator"
version = "0.3.6"
description = "Generate slurm scripts."
readme = "README.md"
keywords = [ "python" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
]

optional-dependencies.dev = [
  "black",
  "check-manifest",
  "isort",
  "slurm-script-generator[docs]",
  "slurm-script-generator[test]",
]
optional-dependencies.test = [
  "pytest",
  "coverage",
]

optional-dependencies.docs = [
  "ipykernel",
  "myst-parser",
  "nbconvert",
  "nbsphinx",
  "jupyterlab",
  "linkify-it-py",
  "pre-commit",
  "pyproject-fmt",
  "sphinx",
  "sphinx-book-theme",
  "sphinxcontrib-mermaid",
  "sphinx-design",
]

[project.urls]
homepage = "https://max-models.github.io/slurm-script-generator"
documentation = "https://max-models.github.io/slurm-script-generator"
repository = "https://github.com/max-models/slurm-script-generator"

[project.scripts]
generate-slurm-script = "slurm_script_generator.main:main"
slurm-queue = "slurm_script_generator.squeue:main"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.isort]
profile = "black"
